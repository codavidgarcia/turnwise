name: Feature request
description: Propose a change to Turnwise
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, not the solution. What gets in your way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
