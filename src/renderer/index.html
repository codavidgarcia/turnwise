<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Turnwise</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Iconos: una familia lineal propia, rejilla de 20, trazo 1.6 -->
    <svg class="svg-sprite" width="0" height="0" aria-hidden="true">
      <defs>
        <!-- Marca "Bloques": retícula bloque 4 / hueco 1, la misma que scripts/build-icons.mjs -->
        <symbol id="i-mark" viewBox="-1 -1 16 16"><rect x="0" y="0" width="4" height="4" rx="0.9" /><rect x="5" y="0" width="4" height="4" rx="0.9" /><rect x="10" y="0" width="4" height="4" rx="0.9" /><rect x="5" y="5" width="4" height="4" rx="0.9" /><rect x="5" y="10" width="4" height="4" rx="0.9" /></symbol>
        <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11" /></symbol>
        <symbol id="i-folder" viewBox="0 0 20 20"><path d="M3 6a1.5 1.5 0 0 1 1.5-1.5h3l1.5 1.8h6.5A1.5 1.5 0 0 1 17 7.8v6.7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5z" /></symbol>
        <symbol id="i-settings" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.3" /><path d="M10 3v1.6M10 15.4V17M3 10h1.6M15.4 10H17M5 5l1.2 1.2M13.8 13.8 15 15M15 5l-1.2 1.2M6.2 13.8 5 15" /></symbol>
        <symbol id="i-theme" viewBox="0 0 20 20"><path d="M16 12.2A6.5 6.5 0 0 1 7.8 4a6.5 6.5 0 1 0 8.2 8.2z" /></symbol>
        <symbol id="i-menu" viewBox="0 0 20 20"><path d="M4 6h12M4 10h12M4 14h8" /></symbol>
        <symbol id="i-panel" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2" /><path d="M12.5 4v12" /></symbol>
        <symbol id="i-close" viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8" /></symbol>
        <symbol id="i-paperclip" viewBox="0 0 20 20"><path d="M14.5 9.5 9.8 14.2a3 3 0 0 1-4.2-4.2l5.6-5.6a2 2 0 0 1 2.8 2.8l-5.6 5.6a1 1 0 0 1-1.4-1.4l4.8-4.8" /></symbol>
        <symbol id="i-shield" viewBox="0 0 20 20"><path d="M10 3l5.5 2v4.6c0 3.6-2.4 6.1-5.5 7.4-3.1-1.3-5.5-3.8-5.5-7.4V5z" /></symbol>
        <symbol id="i-chevron" viewBox="0 0 20 20"><path d="M8 6l4 4-4 4" /></symbol>
        <symbol id="i-arrow-up" viewBox="0 0 20 20"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9" /></symbol>
        <symbol id="i-stop" viewBox="0 0 20 20"><rect x="6" y="6" width="8" height="8" rx="1.5" /></symbol>
        <symbol id="i-file" viewBox="0 0 20 20"><path d="M5.5 3h6l3.5 3.5V16a1 1 0 0 1-1 1h-8.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" /><path d="M11.5 3v3.5H15" /></symbol>
        <symbol id="i-search" viewBox="0 0 20 20"><circle cx="9" cy="9" r="4.8" /><path d="M12.6 12.6 16.5 16.5" /></symbol>
        <symbol id="i-pencil" viewBox="0 0 20 20"><path d="M12.8 4.2 15.8 7.2 7.5 15.5 4 16l.5-3.5z" /><path d="M11.3 5.7l3 3" /></symbol>
        <symbol id="i-terminal" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2" /><path d="M6.5 8.2 8.8 10l-2.3 1.8M10.5 12.5h3" /></symbol>
        <symbol id="i-list" viewBox="0 0 20 20"><path d="M8 6h8M8 10h8M8 14h8" /><path d="M4.2 6h.6M4.2 10h.6M4.2 14h.6" /></symbol>
        <symbol id="i-book" viewBox="0 0 20 20"><path d="M4 4.5h4.5A1.5 1.5 0 0 1 10 6v10a1.5 1.5 0 0 0-1.5-1.5H4zM16 4.5h-4.5A1.5 1.5 0 0 0 10 6v10a1.5 1.5 0 0 1 1.5-1.5H16z" /></symbol>
        <symbol id="i-plug" viewBox="0 0 20 20"><path d="M7.5 3v4M12.5 3v4M5.5 7h9v2.5a4.5 4.5 0 0 1-9 0zM10 14v3" /></symbol>
        <symbol id="i-dot" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2" /></symbol>
        <symbol id="i-alert" viewBox="0 0 20 20"><path d="M10 3.5 17 16H3z" /><path d="M10 8.5v3.2M10 13.8v.1" /></symbol>
        <symbol id="i-fold" viewBox="0 0 20 20"><path d="M4 7h12M4 13h12M10 3v2.5M8.5 4 10 5.5 11.5 4M10 17v-2.5M8.5 16 10 14.5 11.5 16" /></symbol>
        <symbol id="i-check" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" /><path d="M7.3 10.2 9.2 12l3.6-3.8" /></symbol>
        <symbol id="i-progress" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" /><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor" stroke="none" /></symbol>
        <symbol id="i-circle" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" /></symbol>
        <symbol id="i-globe" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" /><path d="M3.5 10h13M10 3.5c1.8 1.9 2.7 4 2.7 6.5s-.9 4.6-2.7 6.5c-1.8-1.9-2.7-4-2.7-6.5s.9-4.6 2.7-6.5z" /></symbol>
        <symbol id="i-branch" viewBox="0 0 20 20"><circle cx="6.5" cy="5" r="1.7" /><circle cx="6.5" cy="15" r="1.7" /><circle cx="13.5" cy="7" r="1.7" /><path d="M6.5 6.7v6.6M6.5 11.5c0-2 1.2-2.6 3.5-2.8 2-.2 3.5-.6 3.5-2" /></symbol>
        <symbol id="i-box" viewBox="0 0 20 20"><path d="M10 3 16.5 6.5v7L10 17l-6.5-3.5v-7z" /><path d="M3.5 6.5 10 10l6.5-3.5M10 10v7" /></symbol>
        <symbol id="i-chip" viewBox="0 0 20 20"><rect x="5.5" y="5.5" width="9" height="9" rx="1.5" /><path d="M8 3v2.5M12 3v2.5M8 14.5V17M12 14.5V17M3 8h2.5M3 12h2.5M14.5 8H17M14.5 12H17" /></symbol>
        <symbol id="i-gauge" viewBox="0 0 20 20"><path d="M4 14a6.5 6.5 0 1 1 12 0" /><path d="M10 13.5l3-4.5" /></symbol>
      </defs>
    </svg>

    <div id="shell" data-rail="open" data-review="closed">
      <!-- Carril: proyectos y conversaciones -->
      <aside id="rail" aria-label="Proyectos y conversaciones">
        <header class="rail-head">
          <span class="brand">
            <svg class="brand-mark" aria-hidden="true"><use href="#i-mark" /></svg>
            <span class="wordmark">Turnwise</span>
          </span>
          <button id="close-rail" class="btn btn-ghost btn-icon only-compact" aria-label="Cerrar carril">
            <svg class="icon"><use href="#i-close" /></svg>
          </button>
        </header>
        <button id="new-thread" class="rail-new" type="button">
          <svg class="icon"><use href="#i-plus" /></svg>
          <span>Nueva conversación</span>
          <kbd>Ctrl N</kbd>
        </button>
        <button id="open-folder" class="rail-new" type="button">
          <svg class="icon"><use href="#i-folder" /></svg>
          <span>Abrir carpeta…</span>
          <kbd>Ctrl O</kbd>
        </button>
        <label class="rail-search">
          <svg class="icon"><use href="#i-search" /></svg>
          <input id="thread-search" type="search" placeholder="Buscar conversaciones" aria-label="Buscar conversaciones" spellcheck="false" />
          <kbd>Ctrl K</kbd>
        </label>
        <nav id="threads" class="rail-threads" aria-label="Conversaciones"></nav>
        <footer class="rail-foot">
          <button id="open-settings" class="rail-link" type="button">
            <svg class="icon"><use href="#i-settings" /></svg>
            <span>Configuración</span>
          </button>
          <button id="toggle-theme" class="btn btn-ghost btn-icon" type="button" aria-label="Cambiar tema" title="Cambiar tema">
            <svg class="icon"><use href="#i-theme" /></svg>
          </button>
        </footer>
      </aside>

      <!-- Bitácora -->
      <main id="main">
        <header class="topbar">
          <button id="toggle-rail" class="btn btn-ghost btn-icon only-compact" type="button" aria-label="Conversaciones">
            <svg class="icon"><use href="#i-menu" /></svg>
          </button>
          <div class="crumbs">
            <span id="crumb-project" class="crumb-project"></span>
            <span class="crumb-sep" aria-hidden="true">/</span>
            <h1 id="thread-title" class="crumb-title">Turnwise</h1>
          </div>
          <div id="run-status" class="run-status" role="status" hidden>
            <span class="run-dot" aria-hidden="true"></span>
            <span id="run-label">Trabajando</span>
            <span id="run-clock" class="run-clock">0:00</span>
          </div>
          <button id="toggle-review" class="btn btn-ghost btn-icon" type="button" aria-label="Panel de revisión" title="Panel de revisión" aria-controls="review">
            <svg class="icon"><use href="#i-panel" /></svg>
          </button>
        </header>

        <div id="scroller" class="scroller">
          <div id="log" class="log" role="log" aria-label="Bitácora de la conversación"></div>
        </div>

        <footer class="dock">
          <div class="context">
            <button class="context-where" id="context-where" type="button" aria-label="Cambiar de carpeta: abre una conversación nueva en otra">
              <svg class="icon"><use href="#i-folder" /></svg>
              <span id="context-path" class="context-path"></span>
              <svg class="icon chip-caret"><use href="#i-chevron" /></svg>
            </button>
            <button id="context-diff" class="context-diff" type="button" hidden>
              <span id="context-blocks" class="blocks" aria-hidden="true"></span>
              <span class="figs"><span id="context-add" class="fig-add"></span><span id="context-del" class="fig-del"></span></span>
              <span>Revisar</span>
            </button>
          </div>
          <div class="composer">
            <div id="attachments" class="attachments" hidden></div>
            <div class="composer-row">
              <textarea id="input" rows="1" placeholder="Pide un cambio, una revisión o una explicación…" aria-label="Mensaje para el agente"></textarea>
              <button id="primary-action" class="send" type="button"></button>
            </div>
          </div>
          <div class="composer-bar">
              <div class="chips">
                <button id="attach" class="btn btn-ghost btn-icon" type="button" aria-label="Adjuntar fichero" title="Adjuntar fichero">
                  <svg class="icon"><use href="#i-paperclip" /></svg>
                </button>
                <button id="permission-picker" class="chip" type="button" title="Permisos del agente">
                  <svg class="icon"><use href="#i-shield" /></svg>
                  <span class="chip-value"></span>
                  <svg class="icon chip-caret"><use href="#i-chevron" /></svg>
                </button>
                <span class="bar-spacer"></span>
                <button id="model-picker" class="chip" type="button" title="Modelo">
                  <svg class="icon"><use href="#i-chip" /></svg>
                  <span class="chip-value"></span>
                  <svg class="icon chip-caret"><use href="#i-chevron" /></svg>
                </button>
                <button id="effort-picker" class="chip" type="button" title="Esfuerzo de razonamiento">
                  <svg class="icon"><use href="#i-gauge" /></svg>
                  <span class="chip-value"></span>
                  <svg class="icon chip-caret"><use href="#i-chevron" /></svg>
                </button>
              </div>
          </div>
        </footer>
      </main>

      <!-- Revisión: diff, plan, fuentes -->
      <aside id="review" aria-label="Revisión">
        <header class="review-head">
          <div class="tabs" role="tablist" aria-label="Secciones de revisión">
            <button class="tab" role="tab" type="button" data-tab="diff" aria-selected="true">Diff</button>
            <button class="tab" role="tab" type="button" data-tab="plan" aria-selected="false" tabindex="-1">Plan <span id="plan-count" class="tab-count"></span></button>
            <button class="tab" role="tab" type="button" data-tab="sources" aria-selected="false" tabindex="-1">Fuentes</button>
          </div>
          <button id="close-review" class="btn btn-ghost btn-icon" type="button" aria-label="Cerrar revisión">
            <svg class="icon"><use href="#i-close" /></svg>
          </button>
        </header>
        <section class="panel" data-panel="diff" role="tabpanel">
          <div id="diff-files" class="diff-files"></div>
          <div id="diff-viewer" class="diff-viewer"></div>
        </section>
        <section class="panel" data-panel="plan" role="tabpanel" hidden>
          <ul id="plan-list" class="plan-list"></ul>
        </section>
        <section class="panel" data-panel="sources" role="tabpanel" hidden>
          <form id="web-form" class="search" role="search">
            <svg class="icon"><use href="#i-globe" /></svg>
            <input id="web-query" type="search" placeholder="Buscar en la web" aria-label="Buscar en la web" />
          </form>
          <dl class="facts">
            <dt><svg class="icon"><use href="#i-plug" /></svg>MCP</dt>
            <dd id="mcp-state">Ninguno conectado</dd>
          </dl>
          <div class="source-actions">
            <button id="worktree-btn" class="btn btn-quiet btn-sm" type="button">
              <svg class="icon"><use href="#i-branch" /></svg>Crear worktree
            </button>
            <button id="sandbox-btn" class="btn btn-quiet btn-sm" type="button">
              <svg class="icon"><use href="#i-box" /></svg>Abrir en Windows Sandbox
            </button>
          </div>
          <div id="sources-results" class="sources-results"></div>
        </section>
      </aside>
    </div>

    <!-- Configuración (top layer nativo) -->
    <dialog id="dlg-settings" class="dlg" aria-labelledby="settings-title">
      <form id="settings-form" method="dialog" class="dlg-inner">
        <h2 id="settings-title" class="dlg-title">Configuración</h2>
        <section class="dlg-section" aria-labelledby="sec-endpoint">
          <h3 id="sec-endpoint" class="dlg-section-title">Endpoint del modelo</h3>
          <div class="segmented" role="radiogroup" aria-label="Protocolo">
            <label class="segment"><input type="radio" name="provider" value="openai" /><span>Compatible con OpenAI</span></label>
            <label class="segment"><input type="radio" name="provider" value="anthropic" /><span>Compatible con Anthropic</span></label>
          </div>
          <label class="field">
            <span class="field-label">URL base, con /v1</span>
            <input id="set-base-url" type="url" spellcheck="false" autocomplete="off" />
          </label>
          <label class="field">
            <span class="field-label">Clave API</span>
            <input id="set-api-key" type="password" spellcheck="false" autocomplete="off" />
            <span id="api-key-note" class="field-note"></span>
          </label>
          <div class="field-row">
            <button id="test-provider" type="button" class="btn btn-quiet">Probar conexión</button>
            <p id="provider-status" class="field-status" role="status"></p>
          </div>
        </section>
        <section class="dlg-section" aria-labelledby="sec-tools">
          <h3 id="sec-tools" class="dlg-section-title">Herramientas</h3>
          <label class="field">
            <span class="field-label">Búsqueda web · URL de SearXNG</span>
            <input id="set-search-url" type="text" spellcheck="false" placeholder="https://searx.example/search" />
          </label>
          <label class="field">
            <span class="field-label">Servidor MCP · comando stdio</span>
            <input id="set-mcp-command" type="text" spellcheck="false" placeholder="npx -y @servidor/mcp" />
          </label>
        </section>
        <div class="dlg-actions">
          <button value="cancel" class="btn btn-quiet">Cerrar</button>
          <button value="save" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
